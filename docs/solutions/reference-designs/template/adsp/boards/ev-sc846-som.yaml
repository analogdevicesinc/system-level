# Power input selection
power:
  jumper: JP1
  standalone: "1-2"
  standalone_input: USB Type-C connector P2
  carrier: "2-3"

# Boot mode selection
boot:
  switch: S2
  jtag_position: 0
  flash_position: 1
  modes:
    - [0, No boot]
    - [1, SPI1 flash boot (default)]
    - [2, SPI2 host boot]
    - [3, UART0 boot]
    - [4, Link port 0 boot]
    - [5, xSPI0 flash boot]
    - [6, eMMC boot]
    - [7, xSPI1 flash boot]

# JTAG voltage of the processor, see the adsp-jtag page
jtag_voltage: 1.8 V

# Connector of the serial console
uart: USB Type-C connector P2

hardware_sections:
  - title: JTAG (P4)
    body: |
      **P4** is the JTAG header for an external ICE, such as the ICE-1000 or
      ICE-1500. Use it in standalone mode, or on a carrier board with the debug
      agent disabled.
  - title: USB mode (S1)
    body: |
      Switch **S1** selects the USB mode of the SoM. It is shown in the
      schematic, but not described in the manual.

      .. list-table::
         :header-rows: 1

         * - S1
           - USB mode
         * - OFF
           - Device
         * - ON
           - Host
  - title: Boot mode header (P12)
    body: |
      **P12** is a 6-pin through-hole footprint for controlling the boot mode
      from outside the SoM, for example from a GPIO controller in an automated
      test setup. It is not populated; solder a 6-pin header to use it. It is
      shown in the schematic, but not described in the manual. See the
      schematic for the pinout.

      Set the boot mode switch **S2** to position 0 while P12 is used. In the
      other positions, S2 also drives the boot mode inputs and conflicts with
      the external controller, which can keep the processor from starting.
  - title: Remote power cycling (R163)
    body: |
      The power multiplexer **U20** powers the SoM from one of two inputs:
      the carrier board, through **R164**, or the USB Type-C connector **P2**,
      through **R163**. The carrier board input has priority, and U20 switches
      to USB power when the carrier board power is removed.

      So while a USB cable is connected to P2, for the serial console, turning
      off the power supply of the carrier board does not power off the SoM. To
      power cycle the SoM from the carrier board power input, for example with
      a switched power distribution unit (PDU) in an automated test setup,
      remove the 0 ohm resistor **R163**.

      R163 is on the bottom side of the SoM, next to U20, near the corner with
      the **E1** label. Do not confuse it with R164, the 0 ohm resistor of the
      carrier board input, which is also next to U20. Before removing it,
      check with a multimeter that one pad of R163 connects to the VBUS pins
      of P2.

      After this rework, the SoM can no longer be powered from P2, so it can
      only be used on a carrier board.
