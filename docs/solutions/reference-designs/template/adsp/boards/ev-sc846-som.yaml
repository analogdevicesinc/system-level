# EV-SC846-SOM system-on-module
# Rendered by the som-*.rst.jinja and documents.rst.jinja templates.
# Sources: EV-SC846-SOM manual, Revision 1.0, July 2026

id: ev-sc846-som

description: >-
  The :adi:`EV-SC846-SOM <en/resources/evaluation-hardware-and-software/evaluation-boards-kits/ev-sc846-som.html>`
  is a System-on-Module 2.0 (SoM 2.0) evaluation board for the
  :adi:`ADSP-SC846 <en/products/ADSP-SC846.html>`, a SHARC Connect processor
  with a SHARC-FX core and two ARM Cortex-A55 cores. The SoM carries the
  processor, its memories and power supplies, and plugs into a carrier board
  through its finger edge connector. It can also run standalone, powered from
  its USB Type-C connector, with an external ICE for JTAG.

features:
  - >-
    ADSP-SC846 processor, one SHARC-FX core and two Cortex-A55 cores, 25 MHz
    input clock, up to 1.2 GHz core clock
  - 8 Gbit LPDDR4 (2x 256M x 16)
  - 2 Gbit quad SPI flash, on SPI2
  - 256 Mbit xSPI flash and 256 Mbit xSPI RAM combo device
  - 16 GB eMMC
  - >-
    USB to UART bridge on a USB Type-C connector, which also powers the SoM in
    standalone mode
  - >-
    10-pin 0.05" JTAG header, and a second JTAG header for the hardware
    security module (HSM)
  - Rotary boot mode switch and reset pushbutton

