# EV-SOMCRR2-EZKIT carrier board
# Rendered by the carrier-*.rst.jinja and documents.rst.jinja templates.
# Sources: EV-SOMCRR2-EZKIT manual, Revision 1.0, June 2026, and the
# EV-SOMCRR2-EZKIT schematic

id: ev-somcrr2-ezkit

description: >-
  The :adi:`EV-SOMCRR2-EZKIT <en/resources/evaluation-hardware-and-software/evaluation-boards-kits/ev-somcrr2-ezkit.html>`
  carrier board provides the peripherals needed to evaluate the processor on
  the SoM: audio converters, S/PDIF, Gigabit Ethernet, CAN and A2B expansion.
  It has two SoM 2.0 connectors, SOM A and SOM B, and an on-board debug agent,
  so the processor can be debugged over JTAG without an external in-circuit
  emulator (ICE).

features:
  - Two SoM 2.0 connectors (SOM A and SOM B)
  - xSPI flash and RAM combo memory, and an SPI EEPROM
  - >-
    :adi:`ADAU1966A` 16-channel DAC and two :adi:`ADAU1979` quad ADCs, with
    nine 3.5 mm stereo connectors (16 outputs, 8 inputs)
  - DB25 connector for a TASCAM25 interface
  - S/PDIF coaxial and optical interfaces
  - Two A2B interface connectors per SoM location
  - Two :adi:`ADIN1300` 10/100/1000 Ethernet PHYs, one per SoM location
  - :adi:`ADM3056E` isolated CAN transceiver
  - On-board debug agent (JTAG over USB)
  - Reset and GPIO pushbuttons, 24 LEDs
  - 12 V DC external power supply

