on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-doc:
    runs-on: ${{ vars.RUNNER != '' && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}
    permissions:
      contents: write

    steps:
    - uses: analogdevicesinc/doctools/checkout@action
    - name: Restore mtimes
      run: python3 .github/scripts/restore-mtimes.py

    - uses: actions/cache@v6
      if: ${{ github.event_name == 'push' }}
      with:
        path: docs/_build
        key: docs-build-push-main

    - name: Install pip packages
      run: |
        python3 -m venv venv
        source ./venv/bin/activate
        python3 -m ensurepip
        pip3 install -r docs/requirements.txt --upgrade

    - name: Build doc
      run: |
        source ./venv/bin/activate
        source .github/scripts/sphinx-build.sh

        export GIT_LFS_TO_LINKS="true"
        export GIT_ORG_REPOSITORY="${{ github.repository }}"
        [ "${{ github.event_name }}" = "pull_request" ] \
          && export GIT_BRANCH="${{ github.event.pull_request.head.ref }}" \
          || export GIT_BRANCH="${{ github.ref_name }}"

        [[ "${{ runner.debug }}" != "1" ]] && j_="-jauto"

        sphinx_build

    - uses: analogdevicesinc/doctools/gh-upload-pages-artifact@action
      with:
        new_tag: ${{ github.ref_type == 'tag' }}
        tag: ${{ github.ref_name }}
        path: docs/_build/dirhtml

  check-doc:
    runs-on: ${{ vars.RUNNER != '' && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read

    steps:
    - uses: analogdevicesinc/doctools/checkout@action

    - name: Resolve changed doc sources
      id: changed
      run: |
        git diff --diff-filter=ACM --no-renames --name-only $base_sha..$head_sha \
          -- 'docs/*.rst' 'docs/**/*.rst' > "$RUNNER_TEMP/changed-rst.txt"
        cat "$RUNNER_TEMP/changed-rst.txt"

        # Cache key component, the venv is only valid for one interpreter
        echo "py=$(python3 -VV | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Cache vale venv
      id: venv-cache
      uses: actions/cache@v4
      with:
        path: venv
        key: check-doc-venv-${{ runner.os }}-${{ runner.arch }}-${{ steps.changed.outputs.py }}-docutils-vale

    - name: Install pip packages
      if: ${{ steps.venv-cache.outputs.cache-hit != 'true' }}
      run: |
        python3 -m venv venv
        source ./venv/bin/activate
        python3 -m ensurepip
        pip3 install docutils vale

    - name: Check writing
      run: |
        source ./venv/bin/activate
        mapfile -t files < "$RUNNER_TEMP/changed-rst.txt"

        check_vale() {
          local config=".github/styles/$1"

          echo "$1"
          if grep -q '^\s*Packages\s*=' "$config"; then
            vale sync --config="$config"
          fi

          vale --config="$config" --output=JSON "${files[@]}" | \
            jq -r 'to_entries[] | .key as $file | .value[] |
            "\($file):\(.Line):\(.Span[0])\n::\(.Severity) file=\($file),line=\(.Line),col=\(.Span[0])::vale:\(.Check):\(.Span[0]) \(.Message)"'
        }

        check_vale vale-spelling.ini
        check_vale vale-enforcement.ini

    - name: Check git lfs
      if: ${{ !cancelled() }}
      run: |
        _emit_fmt() {
          msg=$(echo "$1" | tr -d '\t')
          msg=$(printf "$msg" | sed ':a;N;$!ba;s/\n/'%0A'/g')
          printf "%s\n" "$msg"
          exit 1
        }

        lfs_error="
        At least one file should have been an LFS pointer, but is not.
        Please ensure that binary data was committed to git lfs, a tutorial is provided at:
        https://analogdevicesinc.github.io/system-level/contributing/creating_new_pages/#adding-images-and-other-binary-files"

        if ! git ls-files -z -- ':(attr:filter=lfs)' > "$RUNNER_TEMP/lfs-tracked.raw"; then
          echo "::error ::check_lfs: git ls-files failed, git 2.30 or newer is required"
          exit 1
        fi
        tr '\0' '\n' < "$RUNNER_TEMP/lfs-tracked.raw" | sed '/^$/d' \
          | sort > "$RUNNER_TEMP/lfs-tracked.txt"
        [[ ! -s "$RUNNER_TEMP/lfs-tracked.txt" ]] && exit 0

        mapfile -t lfs_files < "$RUNNER_TEMP/lfs-tracked.txt"
        git grep -I --cached -l -z \
          -e '^version https://git-lfs\.github\.com/spec/v1' \
          -- "${lfs_files[@]}" | tr '\0' '\n' | sed '/^$/d' \
          | sort > "$RUNNER_TEMP/lfs-pointers.txt" || true

        not_pointers=$(comm -23 "$RUNNER_TEMP/lfs-tracked.txt" "$RUNNER_TEMP/lfs-pointers.txt")
        [[ -z "$not_pointers" ]] && exit 0

        while read -r file; do
          echo "::error file=$file::File should have been an LFS pointer, but is not"
        done <<< "$not_pointers"
        _emit_fmt "::warning ::check_lfs: $lfs_error"

    - name: Check casing
      if: ${{ !cancelled() }}
      run: |
        python3 .github/scripts/case.py

    - name: Check dangling files
      if: ${{ !cancelled() }}
      run: |
        python3 .github/scripts/dangling.py || true

  deploy:
    runs-on: ubuntu-latest
    needs: [build-doc]
    concurrency:
      group: gh-pages
    permissions:
      pages: write
      id-token: write
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}${{ github.event_name == 'pull_request' && format('pull/{0}', github.event.number) || '' }}

    steps:
    - uses: actions/deploy-pages@v5
      id: deployment
